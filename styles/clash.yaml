# Clash of Clans work, taken from the style samples
# (sharing work online › style samples: Sneezy, Greedy Raven, TH18).
# Full-bleed art, almost no text, matte that matches the art's background,
# film grain and a soft vignette on dark slides, logo in a corner.

name: clash
colors:
  background: "#3b3b3e"
  title: "#ffffff"
  text: "#e1e1e4"
  accent: "#f2c14e"
  muted: "#9a9aa0"
font: Inter
series: ""
matte: auto          # take the background colour from each artwork
grain: true
art_radius: 0
# Logos (assets/), sized and placed like the style samples (Sneezy, TH18):
# - cover: big Clash of Clans logo at the bottom (per slide: logo: assets/clash-logo.png,
#   logo_width ~440). clash-logo.png is cut out of the TH18 thumbnail sample.
# - other slides: Supercell, about 14% of the width, bottom-right when that corner is
#   clear, else the plainest corner; white on dark slides, dark on light ones.
logo_light: assets/supercell-white.png
logo_dark: assets/supercell-dark.png
logo_width: 150
logo_opacity: 1
logo_pos: auto
# Export as high-quality JPEG: about 1–2 MB a slide at 2160 px, under the
# ~3 MB upload limit from Claude's session; Instagram re-encodes to JPEG anyway.
format: jpg
quality: 95
